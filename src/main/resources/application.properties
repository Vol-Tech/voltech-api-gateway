spring.application.name=api-gateway
server.port=8081
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/

spring.cloud.gateway.server.webflux.routes[0].id=inventario
spring.cloud.gateway.server.webflux.routes[0].uri=lb://inventario
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/v1/productos,/api/v1/productos/**

spring.cloud.gateway.server.webflux.routes[1].id=usuarios
spring.cloud.gateway.server.webflux.routes[1].uri=http://localhost:8080
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/v1/usuarios,/api/v1/usuarios/**,/api/v1/auth/**
