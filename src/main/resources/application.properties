spring.application.name=api-gateway
server.port=8080

# parte de eureka
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true

# rutas (I: dejen las rutas a sus microservicios aca ^^)
spring.cloud.gateway.server.webflux.routes[0].id=inventario
spring.cloud.gateway.server.webflux.routes[0].uri=lb://inventario
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/v1/productos/**

spring.cloud.gateway.server.webflux.routes[1].id=usuario
spring.cloud.gateway.server.webflux.routes[1].uri=lb://usuario
spring.cloud.gateway.server.webflux.routes[1].predicates[1]=Path=/api/v1/usuarios/**
